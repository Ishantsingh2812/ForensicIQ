services:
  postgres:
    image: postgres:16-alpine
    container_name: forensicai-postgres
    environment:
      POSTGRES_DB: forensicai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d forensicai"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - forensicai-network

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: forensicai-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forensicai-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: forensicai-ai-service
    environment:
      AI_INTERNAL_TOKEN: forensic-ai-internal-shared-secret-key-2026
      QDRANT_URL: http://qdrant:6333
      QDRANT_GRPC_PORT: 6334
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
    networks:
      - forensicai-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: forensicai-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/forensicai
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      JWT_EXPIRATION_MS: 900000
      JWT_REFRESH_EXPIRATION_MS: 604800000
      AI_SERVICE_URL: http://ai-service:8000
      AI_INTERNAL_TOKEN: forensic-ai-internal-shared-secret-key-2026
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    networks:
      - forensicai-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: forensicai-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8080
      VITE_USE_MOCKS: "false"
    depends_on:
      - backend
    networks:
      - forensicai-network

networks:
  forensicai-network:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:

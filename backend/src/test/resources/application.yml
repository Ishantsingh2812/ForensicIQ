server:
  port: 8080

spring:
  application:
    name: forensicai-backend-test
  datasource:
    url: jdbc:h2:mem:forensicai_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
    show-sql: false
  flyway:
    enabled: false

security:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 900000
    refresh-expiration-ms: 604800000

ai-service:
  url: http://localhost:8000
  internal-token: forensic-ai-internal-shared-secret-key-2026
  connect-timeout-ms: 2000
  read-timeout-ms: 5000

rate-limit:
  capacity: 1000
  refill-tokens: 1000
  duration-minutes: 60
